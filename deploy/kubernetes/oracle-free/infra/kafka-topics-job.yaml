apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics
spec:
  backoffLimit: 8
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-topics
        app.kubernetes.io/component: bootstrap
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: create-topics
          image: confluentinc/cp-kafka:7.9.10
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              until kafka-broker-api-versions --bootstrap-server kafka:9092; do sleep 5; done
              kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic events.ingested --partitions 12 --replication-factor 1
              kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic events.deadletter --partitions 6 --replication-factor 1
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
