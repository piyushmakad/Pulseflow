# Copy this file to secret.yaml, replace every placeholder, and apply it with
# kubectl. secret.yaml is gitignored. URL-encode special password characters in
# DATABASE_URL and REDIS_URL.
apiVersion: v1
kind: Secret
metadata:
  name: pulseflow-secrets
  namespace: pulseflow
type: Opaque
stringData:
  POSTGRES_DB: pulseflow
  POSTGRES_USER: pulseflow
  POSTGRES_PASSWORD: replace-with-a-long-random-password
  DATABASE_URL: postgres://pulseflow:replace-with-url-encoded-password@postgres:5432/pulseflow?sslmode=disable
  REDIS_PASSWORD: replace-with-a-long-random-password
  REDIS_URL: redis://:replace-with-url-encoded-password@redis:6379/0
