apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pulseflow
resources:
  - ../../base
images:
  - name: pulseflow
    newName: bom.ocir.io/replace-with-tenancy-namespace/pulseflow
    newTag: 0.1.0
replicas:
  - name: pulseflow-api
    count: 2
  - name: pulseflow-worker
    count: 1
patches:
  - path: api-load-balancer-patch.yaml
