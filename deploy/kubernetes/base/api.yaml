apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulseflow-api
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pulseflow-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pulseflow-api
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      imagePullSecrets:
        - name: ocir-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: pulseflow
          image: pulseflow:latest
          imagePullPolicy: IfNotPresent
          args: ["--mode=api"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: pulseflow-config
            - secretRef:
                name: pulseflow-secrets
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: pulseflow-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pulseflow-api
  ports:
    - name: http
      port: 80
      targetPort: http
